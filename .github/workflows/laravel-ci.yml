name: Laravel CI Pipeline

on:
  push:
    branches: [ "main", "master", "dev", "develop" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  laravel-build-test:
    name: Build, Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2 Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, json, libxml, curl, gd
          coverage: none

      - name: 📦 Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: 🚀 Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: ⚡ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🎨 Install NPM Dependencies & Build Vite Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 🔑 Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 🛡️ Verify Routes and Config Integrity
        run: |
          php artisan route:list --compact
